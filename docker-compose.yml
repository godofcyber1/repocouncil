services:
  postgres:
    image: postgres:16-alpine
    container_name: repocouncil-postgres
    environment:
      POSTGRES_DB: repocouncil
      POSTGRES_USER: repocouncil
      POSTGRES_PASSWORD: repocouncil
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repocouncil -d repocouncil"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
